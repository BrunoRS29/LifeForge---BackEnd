# src/main/resources/application.conf
# Configuracao principal do Ktor (HOCON)
# Variaveis sensiveis vem do .env / variaveis de ambiente

ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }

    application {
        modules = [ com.lifeforge.ApplicationKt.module ]
    }
}

postgres {
    driverClassName = "org.postgresql.Driver"
    url = "jdbc:postgresql://localhost:5432/lifeforge"
    url = ${?DATABASE_URL}
    user = "lifeforge"
    user = ${?DATABASE_USER}
    password = "lifeforge"
    password = ${?DATABASE_PASSWORD}
    maximumPoolSize = 10
}

jwt {
    secret = "change-me-in-production-use-a-long-random-string"
    secret = ${?JWT_SECRET}
    issuer = "lifeforge-api"
    audience = "lifeforge-app"
    realm = "LifeForge API"
    # 7 dias em milissegundos
    expirationMs = 604800000
}

ml {
    # URL do microsservico Python.
    # Em docker-compose, "ml-service" eh resolvido via DNS interno do compose.
    baseUrl = "http://ml-service:8000"
    baseUrl = ${?ML_BASE_URL}

    # Timeouts (millis)
    requestTimeoutMs = 30000
    requestTimeoutMs = ${?ML_REQUEST_TIMEOUT_MS}

    connectTimeoutMs = 5000
    connectTimeoutMs = ${?ML_CONNECT_TIMEOUT_MS}

    # Retry com backoff exponencial em IO/timeout/5xx
    maxRetries = 3
    maxRetries = ${?ML_MAX_RETRIES}

    retryBaseDelayMs = 200
    retryBaseDelayMs = ${?ML_RETRY_BASE_DELAY_MS}
}
