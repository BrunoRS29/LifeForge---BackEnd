name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Backend — build e testes (Kotest + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Permissao de execucao do gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes e gerar cobertura
        run: ./gradlew test --no-daemon

      - name: Publicar relatorio de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          if-no-files-found: ignore

  ml-service:
    name: Microsservico de IA — testes (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: python -m pytest -q
