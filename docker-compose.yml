# docker-compose.yml (Sprint 5)
# Orquestracao local: PostgreSQL + Backend Ktor + ML Service Python
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lifeforge}
      POSTGRES_USER: ${DATABASE_USER:-lifeforge}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lifeforge}
    ports:
      - "5432:5432"
    volumes:
      - lifeforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-lifeforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # ML SERVICE (Sprint 5) — FastAPI + scikit-learn
  # ============================================================
  # Roda na mesma rede do compose. O backend resolve via DNS "ml-service".
  # Nao expomos a porta para o host por padrao (apenas internamente);
  # descomente o bloco `ports` se quiser bater na Swagger UI direto do PC.
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: lifeforge-ml-service
    restart: unless-stopped
    environment:
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
    # ports:
    #   - "8000:8000"
    healthcheck:
      # O Dockerfile do servico ja define HEALTHCHECK proprio,
      # mas reforcamos aqui para o `depends_on: condition: service_healthy`
      # do backend funcionar de forma confiavel em qualquer versao do compose.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Sprint 5: aguarda o ML estar healthy antes de aceitar trafego.
      ml-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-lifeforge}
      DATABASE_USER: ${DATABASE_USER:-lifeforge}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-lifeforge}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      # Sprint 5: aponta o backend para o microsservico ML pelo nome DNS
      # interno do compose. Pode ser sobrescrito em desenvolvimento local.
      ML_BASE_URL: ${ML_BASE_URL:-http://ml-service:8000}

volumes:
  lifeforge_pg_data:
