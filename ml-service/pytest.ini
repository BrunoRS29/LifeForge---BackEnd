[pytest]
testpaths = tests
# Escopo explicito do event loop dos fixtures assincronos (evita o aviso de
# depreciacao do pytest-asyncio e fixa o comportamento entre versoes).
asyncio_default_fixture_loop_scope = function
# Avisos de convergencia do statsmodels sao esperados com series sinteticas
# curtas e nao indicam falha do modelo (ha recuo para tendencia linear).
filterwarnings =
    ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning
    ignore::UserWarning:statsmodels
    ignore:scipy.optimize:DeprecationWarning
